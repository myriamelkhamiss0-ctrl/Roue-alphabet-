<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roue de l'alphabet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=DM+Sans:wght@400;600&display=swap">
<style>
/* Layout: one screen, the wheel centered, timer in its hub, controls below. Single committed look (cobalt + sun yellow). */
:root{
  --bg:#1d3fb8; --bg-deep:#142d8a; --key:#ffd23f; --key-ink:#1a1f3a;
  --used:#3552c4; --used-ink:#7f93d9; --hot:#ff5a4e; --ink:#ffffff; --soft:#c9d4ff;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%, var(--bg) 0%, var(--bg-deep) 100%); background-color:var(--bg-deep); color:var(--ink); font-family:var(--body);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:16px; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; gap:14px; overflow-x:hidden}
h1{font-family:var(--display); font-weight:800; font-size:clamp(1.5rem,6vw,2.1rem); margin:4px 0 0; letter-spacing:.01em; text-wrap:balance; text-align:center}
.hint{margin:0; color:var(--soft); font-size:.95rem; text-align:center; max-width:34ch}
.wheel{position:relative; width:min(100%, 440px); aspect-ratio:1; max-width:100%}
.wheel::before{content:""; position:absolute; inset:0; border-radius:50%; background:var(--bg-deep); box-shadow:inset 0 0 0 6px rgba(255,255,255,.08)}
.key{position:absolute; width:12.5%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; border:none;
  background:var(--key); color:var(--key-ink); font-family:var(--display); font-weight:800; font-size:clamp(1rem,5.2vw,1.55rem);
  cursor:pointer; box-shadow:0 4px 0 #c99a00; transition:transform .12s, background .2s; padding:0; line-height:1}
.key:active{transform:translate(-50%,-46%); box-shadow:0 1px 0 #c99a00}
.key:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.key.used{background:var(--used); color:var(--used-ink); box-shadow:none; cursor:default; text-decoration:line-through}
.hub{position:absolute; left:50%; top:50%; width:52%; aspect-ratio:1; transform:translate(-50%,-50%); display:grid; place-items:center}
.hub svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
.track{fill:none; stroke:rgba(255,255,255,.12); stroke-width:8}
.prog{fill:none; stroke:var(--key); stroke-width:8; stroke-linecap:round; transition:stroke .2s}
.hub.danger .prog{stroke:var(--hot)}
.center{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center}
.num{font-family:var(--display); font-weight:800; font-size:clamp(2.6rem,14vw,4.2rem); line-height:1; font-variant-numeric:tabular-nums}
.hub.danger .num{color:var(--hot)}
.last{font-size:.85rem; color:var(--soft); min-height:1.2em}
.boom{font-family:var(--display); font-weight:800; color:var(--hot); font-size:clamp(1.1rem,5vw,1.4rem); line-height:1.1}
.controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.btn{font-family:var(--display); font-weight:800; font-size:1.1rem; border:none; border-radius:999px; padding:10px 22px; cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.go{background:var(--hot); color:#fff; box-shadow:0 4px 0 #b8322a}
.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--soft)}
.count{color:var(--soft); font-size:.9rem; font-variant-numeric:tabular-nums}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-53%,-50%)}75%{transform:translate(-47%,-50%)}}
.hub.over{animation:shake .25s 3}
@media (prefers-reduced-motion:reduce){.hub.over{animation:none}.key,.prog{transition:none}}
</style>
</head>
<body>

<h1>Roue de l'alphabet</h1>
<p class="hint">Lance le chrono, trouve un mot, touche sa lettre : le chrono repart à 5 secondes.</p>

<div class="wheel" id="wheel">
  <div class="hub" id="hub">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="44"></circle>
      <circle class="prog" id="prog" cx="50" cy="50" r="44"></circle>
    </svg>
    <div class="center" id="center" aria-live="polite">
      <div class="num" id="num">5</div>
      <div class="last" id="last">Prêt ?</div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn go" id="start" type="button">Démarrer</button>
  <button class="btn ghost" id="reset" type="button">Nouvelle partie</button>
</div>
<div class="count" id="count">26 lettres restantes</div>

<script>
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const DURATION = 5000;
const wheel = document.getElementById("wheel"), hub = document.getElementById("hub");
const num = document.getElementById("num"), last = document.getElementById("last");
const prog = document.getElementById("prog"), center = document.getElementById("center");
const startBtn = document.getElementById("start"), resetBtn = document.getElementById("reset"), countEl = document.getElementById("count");
const C = 2 * Math.PI * 44;
prog.style.strokeDasharray = C;

let running = false, endAt = 0, raf = 0, used = new Set(), audio = null;

LETTERS.forEach((L, i) => {
  const a = (i / LETTERS.length) * 2 * Math.PI - Math.PI / 2;
  const b = document.createElement("button");
  b.className = "key"; b.type = "button"; b.textContent = L; b.id = "key-" + L;
  b.setAttribute("aria-label", "Lettre " + L);
  b.style.left = (50 + 42 * Math.cos(a)) + "%";
  b.style.top = (50 + 42 * Math.sin(a)) + "%";
  b.addEventListener("click", () => pick(L, b));
  wheel.appendChild(b);
});

function beep(freq, dur, type="sine", vol=.2){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audio.destination);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}

function setCenter(n, sub){
  center.innerHTML = '<div class="num" id="num">'+n+'</div><div class="last">'+sub+'</div>';
}

function draw(remaining){
  const frac = Math.max(0, remaining / DURATION);
  prog.style.strokeDashoffset = C * (1 - frac);
  const secs = Math.ceil(remaining / 1000);
  const n = center.querySelector(".num");
  if (n && n.textContent != secs) { n.textContent = secs; if (running && secs <= 2 && secs > 0) beep(880, .08); }
  hub.classList.toggle("danger", remaining <= 2000);
}

function tick(){
  const rem = endAt - performance.now();
  if (rem <= 0) { timeUp(); return; }
  draw(rem);
  raf = requestAnimationFrame(tick);
}

function start(){
  if (used.size === LETTERS.length) return;
  running = true; hub.classList.remove("over");
  endAt = performance.now() + DURATION;
  setCenter(5, "À toi !");
  startBtn.textContent = "Pause"; cancelAnimationFrame(raf); tick();
  beep(520, .1);
}

function stop(msg){
  running = false; cancelAnimationFrame(raf);
  startBtn.textContent = "Démarrer";
  if (msg) setCenter(5, msg), draw(DURATION);
}

function pick(L, b){
  if (used.has(L)) return;
  used.add(L); b.classList.add("used"); b.disabled = true;
  const left = LETTERS.length - used.size;
  countEl.textContent = left + (left > 1 ? " lettres restantes" : " lettre restante");
  if (left === 0) { stop(); setCenter("🎉", "Bravo, toutes faites !"); draw(DURATION); beep(660,.15); setTimeout(()=>beep(990,.3),150); return; }
  if (!running) { start(); }
  else { endAt = performance.now() + DURATION; beep(660, .07, "triangle"); }
  center.querySelector(".last").textContent = "Lettre " + L;
}

function timeUp(){
  running = false; cancelAnimationFrame(raf); draw(0);
  center.innerHTML = '<div class="num">0</div><div class="boom">Temps écoulé !</div>';
  hub.classList.add("danger"); hub.classList.remove("over"); void hub.offsetWidth; hub.classList.add("over");
  startBtn.textContent = "Rejouer";
  beep(180, .6, "sawtooth", .25);
}

startBtn.addEventListener("click", () => running ? stop("En pause") : start());
resetBtn.addEventListener("click", () => {
  stop(); used.clear();
  document.querySelectorAll(".key").forEach(k => { k.classList.remove("used"); k.disabled = false; });
  countEl.textContent = "26 lettres restantes";
  hub.classList.remove("danger","over"); setCenter(5, "Prêt ?"); draw(DURATION);
});
draw(DURATION);
</script>
</body>
</html>
